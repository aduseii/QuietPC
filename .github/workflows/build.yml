name: Build

# Every push to main builds QuietPC.exe on Windows and publishes it as a GitHub release
# named after the <Version> in QuietPC.csproj (bump the version to make a new release).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build QuietPC.exe
        run: dotnet build QuietPC.csproj -c Release -nologo

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content QuietPC.csproj
          $v = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: QuietPC-${{ steps.version.outputs.version }}
          path: bin/Release/net48/QuietPC.exe

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Quiet PC ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: bin/Release/net48/QuietPC.exe
          body: |
            Download **QuietPC.exe** below, double-click it and choose **Yes** to install.

            Windows SmartScreen may warn you because the app isn't code-signed. Click **More info**, then **Run anyway**.

            See the [README](https://github.com/aduseii/QuietPC#readme) for what it does and how to use it.
